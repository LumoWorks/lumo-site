<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lumo Labs Noomo-style study</title>
  <style>
    :root {
      color-scheme: light;
      --paper:#f5f3ef;
      --ink:#050505;
      --muted:#6f6d68;
      --line:rgba(5,5,5,.12);
      --pink:#ff8fd6;
      --violet:#9a7cff;
      --cyan:#8ce7ff;
      --lime:#d9ff6a;
    }
    * { box-sizing:border-box; }
    html, body { min-height:100%; }
    body {
      margin:0;
      overflow-x:hidden;
      color:var(--ink);
      background:
        radial-gradient(circle at 52% 34%, rgba(255,255,255,.96), transparent 19rem),
        radial-gradient(circle at 68% 16%, rgba(154,124,255,.24), transparent 24rem),
        radial-gradient(circle at 24% 82%, rgba(140,231,255,.26), transparent 25rem),
        var(--paper);
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body::before {
      content:"";
      position:fixed;
      inset:0;
      z-index:0;
      pointer-events:none;
      background-image:radial-gradient(rgba(5,5,5,.16) 1px, transparent 1px);
      background-size:18px 18px;
      mask-image:radial-gradient(circle at 50% 46%, #000 0 36%, transparent 78%);
      opacity:.42;
    }
    a { color:inherit; text-decoration:none; }
    .page {
      min-height:100svh;
      position:relative;
      isolation:isolate;
      display:grid;
      grid-template-rows:auto 1fr auto;
      overflow:hidden;
    }
    nav {
      position:relative;
      z-index:8;
      width:min(1380px, calc(100% - 48px));
      height:76px;
      margin:auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      font-size:12px;
      font-weight:850;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    .logo {
      font-size:25px;
      line-height:1;
      letter-spacing:-.06em;
      text-transform:none;
      font-weight:950;
    }
    .nav {
      display:flex;
      align-items:center;
      gap:24px;
    }
    .button {
      border:1px solid var(--line);
      border-radius:999px;
      padding:11px 16px;
      background:rgba(255,255,255,.44);
      backdrop-filter:blur(16px);
      box-shadow:0 18px 40px rgba(24,20,18,.07);
    }
    .hero {
      position:relative;
      width:min(1380px, calc(100% - 48px));
      margin:auto;
      display:grid;
      place-items:center;
    }
    .wordmark {
      position:absolute;
      left:50%;
      top:45%;
      transform:translate(-50%, -50%);
      z-index:1;
      width:100%;
      display:grid;
      gap:clamp(8px, 1.3vw, 18px);
      text-align:center;
      pointer-events:none;
      user-select:none;
    }
    .wordmark span {
      display:block;
      font-size:clamp(92px, 19.4vw, 290px);
      line-height:.74;
      font-weight:950;
      letter-spacing:-.09em;
      text-transform:uppercase;
      white-space:nowrap;
    }
    .wordmark .outline {
      color:transparent;
      -webkit-text-stroke:clamp(1px, .16vw, 2px) rgba(5,5,5,.38);
    }
    .specimen {
      position:relative;
      z-index:4;
      width:min(560px, 70vw);
      aspect-ratio:1 / 1.2;
      transform-style:preserve-3d;
      animation:specimenFloat 6.8s ease-in-out infinite;
    }
    .halo {
      position:absolute;
      inset:18% 6% 20%;
      z-index:-1;
      border-radius:50%;
      background:
        radial-gradient(circle at 52% 42%, rgba(255,255,255,.78), transparent 34%),
        conic-gradient(from 30deg, rgba(255,143,214,.36), rgba(140,231,255,.42), rgba(217,255,106,.24), rgba(154,124,255,.38), rgba(255,143,214,.36));
      filter:blur(22px);
      opacity:.85;
      animation:haloSpin 11s linear infinite;
    }
    .jelly {
      width:100%;
      height:100%;
      overflow:visible;
      filter:drop-shadow(0 42px 72px rgba(79,73,122,.24));
    }
    .glass {
      position:absolute;
      z-index:5;
      border:1px solid rgba(255,255,255,.72);
      border-radius:22px;
      background:
        linear-gradient(135deg, rgba(255,255,255,.72), rgba(255,255,255,.24)),
        radial-gradient(circle at 18% 22%, rgba(255,255,255,.84), transparent 36%);
      backdrop-filter:blur(20px);
      box-shadow:0 24px 70px rgba(44,44,64,.12);
    }
    .glass.one {
      width:180px;
      height:86px;
      left:8%;
      top:23%;
      transform:rotate(-13deg);
      animation:tileA 7s ease-in-out infinite;
    }
    .glass.two {
      width:120px;
      height:120px;
      right:10%;
      top:22%;
      transform:rotate(16deg);
      border-radius:32px;
      animation:tileB 6.6s ease-in-out infinite;
    }
    .glass.three {
      width:210px;
      height:96px;
      right:16%;
      bottom:20%;
      transform:rotate(-8deg);
      animation:tileC 8s ease-in-out infinite;
    }
    .caption {
      width:min(760px, calc(100% - 36px));
      margin:0 auto 32px;
      position:relative;
      z-index:8;
      text-align:center;
      color:var(--muted);
      font-size:15px;
      line-height:1.65;
    }
    .caption strong {
      display:block;
      color:var(--ink);
      font-size:18px;
      margin-bottom:8px;
    }
    .tagline {
      position:absolute;
      z-index:6;
      left:50%;
      bottom:16%;
      transform:translateX(-50%);
      display:flex;
      align-items:center;
      gap:10px;
      border:1px solid rgba(5,5,5,.12);
      border-radius:999px;
      background:rgba(255,255,255,.5);
      backdrop-filter:blur(18px);
      padding:11px 14px;
      font-size:12px;
      font-weight:900;
      letter-spacing:.08em;
      text-transform:uppercase;
      white-space:nowrap;
      box-shadow:0 18px 44px rgba(25,25,32,.08);
    }
    .tagline i {
      width:9px;
      height:9px;
      border-radius:50%;
      background:var(--lime);
      box-shadow:0 0 18px var(--lime);
    }
    @keyframes specimenFloat {
      0%, 100% { transform:translateY(0) rotate(-1.5deg); }
      50% { transform:translateY(-24px) rotate(2deg); }
    }
    @keyframes haloSpin { to { transform:rotate(360deg); } }
    @keyframes tileA { 50% { transform:translateY(-22px) rotate(-7deg); } }
    @keyframes tileB { 50% { transform:translateY(18px) rotate(9deg); } }
    @keyframes tileC { 50% { transform:translateY(-14px) rotate(-14deg); } }
    @media (max-width:720px) {
      nav { width:min(100% - 24px, 1380px); height:66px; }
      .nav a:not(.button) { display:none; }
      .hero { width:100%; min-height:690px; overflow:hidden; }
      .wordmark { top:42%; width:116%; }
      .wordmark span {
        font-size:clamp(86px, 28vw, 132px);
        line-height:.8;
      }
      .specimen { width:min(390px, 92vw); }
      .glass.one { left:-4%; top:24%; transform:rotate(-10deg) scale(.8); }
      .glass.two { right:-5%; top:28%; transform:rotate(12deg) scale(.72); }
      .glass.three { right:2%; bottom:21%; transform:rotate(-7deg) scale(.72); }
      .tagline { bottom:12%; max-width:calc(100% - 24px); white-space:normal; justify-content:center; text-align:center; }
      .caption { margin-bottom:26px; font-size:14px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <nav>
      <a class="logo" href="#">lumo</a>
      <div class="nav">
        <a href="#study">study</a>
        <a href="#preview">preview</a>
        <a class="button" href="mailto:hugo.uno.claw@gmail.com">connect</a>
      </div>
    </nav>

    <section class="hero" id="preview" aria-label="Lumo Labs immersive study">
      <div class="wordmark" aria-hidden="true">
        <span>Lumo</span>
        <span class="outline">Labs</span>
        <span>Works</span>
      </div>

      <div class="glass one" aria-hidden="true"></div>
      <div class="glass two" aria-hidden="true"></div>
      <div class="glass three" aria-hidden="true"></div>

      <div class="specimen" aria-hidden="true">
        <div class="halo"></div>
        <svg class="jelly" viewBox="0 0 620 720" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="domeGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(250 170) rotate(46) scale(260 160)">
              <stop stop-color="#fff" stop-opacity=".98"/>
              <stop offset=".34" stop-color="#ffd8fb" stop-opacity=".9"/>
              <stop offset=".68" stop-color="#9edcff" stop-opacity=".78"/>
              <stop offset="1" stop-color="#6d72ff" stop-opacity=".55"/>
            </radialGradient>
            <linearGradient id="tentacle" x1="0" x2="0" y1="255" y2="660" gradientUnits="userSpaceOnUse">
              <stop stop-color="#a685ff" stop-opacity=".72"/>
              <stop offset=".42" stop-color="#8ce7ff" stop-opacity=".42"/>
              <stop offset="1" stop-color="#8ce7ff" stop-opacity="0"/>
            </linearGradient>
            <filter id="softBlur" x="-40%" y="-40%" width="180%" height="180%">
              <feGaussianBlur stdDeviation="7"/>
            </filter>
            <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#38316c" flood-opacity=".22"/>
            </filter>
          </defs>
          <ellipse cx="310" cy="634" rx="168" ry="34" fill="#29234d" opacity=".16" filter="url(#softBlur)"/>
          <path d="M112 220C132 104 224 50 327 56c118 7 191 82 199 185 5 62-42 91-126 103-96 14-225 1-267-38-20-18-27-49-21-86Z" fill="url(#domeGlow)" stroke="rgba(255,255,255,.78)" stroke-width="2" filter="url(#innerShadow)"/>
          <path d="M145 250c85 42 286 45 360 0-7 56-67 99-177 108-119 10-185-35-183-108Z" fill="#16142a" opacity=".18"/>
          <path d="M168 267c52 18 237 26 314-3" stroke="#080808" stroke-opacity=".18" stroke-width="18" stroke-linecap="round" stroke-dasharray="10 22"/>
          <path d="M190 314C164 405 168 486 134 662" stroke="url(#tentacle)" stroke-width="6" stroke-linecap="round"/>
          <path d="M238 326C226 420 264 486 226 688" stroke="url(#tentacle)" stroke-width="5" stroke-linecap="round"/>
          <path d="M291 335C286 438 312 505 302 704" stroke="url(#tentacle)" stroke-width="6" stroke-linecap="round"/>
          <path d="M344 334C352 430 330 520 374 690" stroke="url(#tentacle)" stroke-width="5" stroke-linecap="round"/>
          <path d="M400 321C435 422 426 508 480 660" stroke="url(#tentacle)" stroke-width="6" stroke-linecap="round"/>
          <path d="M460 298C500 390 520 470 560 610" stroke="url(#tentacle)" stroke-width="4" stroke-linecap="round"/>
          <circle cx="238" cy="138" r="58" fill="white" opacity=".48" filter="url(#softBlur)"/>
          <circle cx="380" cy="212" r="88" fill="#8ce7ff" opacity=".24" filter="url(#softBlur)"/>
        </svg>
      </div>

      <div class="tagline"><i></i> private preview / trust system / ai studio</div>
    </section>

    <section class="caption" id="study">
      <strong>Noomo-style direction study for Lumo</strong>
      淡色畫布、巨大字型、中央 3D 生物、少量玻璃 UI。這版只做視覺方向，不覆蓋正式官網。
    </section>
  </main>
</body>
</html>
